services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vietlot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/vietlot.db
      - API_V1_STR=/api/v1
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vietlot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vietlot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vietlot-net

networks:
  vietlot-net:
    driver: bridge

volumes:
  backend_data:
    driver: local
